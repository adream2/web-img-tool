<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!-- Edge 商店宣传图块 440×280；左侧图标直接搬自 icons/icon.svg，保证与扩展图标一致 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- 背景装饰斜线 -->
  <g opacity=".07" stroke="#ffffff" stroke-width="1">
    <path d="M-40 240 L140 60"/><path d="M0 280 L180 100"/>
    <path d="M300 300 L480 120"/><path d="M340 320 L520 140"/>
  </g>

  <!-- 白色卡片 + 图标（图标内容与 icon.svg 逐笔一致，scale=0.7333） -->
  <rect x="34" y="96" width="100" height="100" rx="24" fill="#2c1b4d" opacity=".18"/>
  <rect x="34" y="90" width="100" height="100" rx="24" fill="#ffffff"/>

  <g transform="translate(37.07,93.07) scale(0.7333)">
    <circle cx="64" cy="64" r="60" fill="url(#iconBg)"/>
    <rect x="32" y="36" width="64" height="56" rx="4" fill="white" opacity="0.95"/>
    <path d="M 32 72 L 48 56 L 64 72 L 80 52 L 96 72 L 96 92 L 32 92 Z" fill="#667eea" opacity="0.8"/>
    <path d="M 32 80 L 48 68 L 64 80 L 80 64 L 96 80 L 96 92 L 32 92 Z" fill="#764ba2" opacity="0.6"/>
    <circle cx="76" cy="48" r="6" fill="#ffd700"/>
    <g transform="translate(80, 76)">
      <circle cx="12" cy="12" r="14" fill="white" stroke="#667eea" stroke-width="2"/>
      <path d="M 12 6 L 12 18 M 6 12 L 18 12" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 文案（宽度按 22/13/12 px 保守估算，右侧留 ≥40px 余量） -->
  <text x="158" y="122" fill="#ffffff" letter-spacing="-0.3"
        font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif"
        font-size="22" font-weight="700">Web Image Tool Pro</text>

  <text x="158" y="150" fill="#ffffff" fill-opacity=".82"
        font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif"
        font-size="13">网页图片提取 · 批量下载 · 本地处理</text>

  <text x="158" y="176" fill="#ffffff" fill-opacity=".66"
        font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif"
        font-size="12">ZIP 打包 · 格式转换 · 相似图合并 · 图床</text>
</svg>
