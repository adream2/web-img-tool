<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="glow" x1="60" y1="40" x2="240" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="300" height="300" rx="66" fill="url(#bg)"/>
  <circle cx="96" cy="74" r="120" fill="url(#glow)"/>

  <!-- 相框 -->
  <rect x="66" y="86" width="168" height="128" rx="20"
        fill="none" stroke="#ffffff" stroke-width="13" stroke-opacity=".95"/>
  <!-- 太阳 -->
  <circle cx="112" cy="132" r="15" fill="#ffffff" fill-opacity=".95"/>
  <!-- 山线 -->
  <path d="M78 196 L124 150 L156 182 L186 152 L222 196"
        fill="none" stroke="#ffffff" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".95"/>
  <!-- 下载箭头 -->
  <path d="M150 214 v26" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-opacity="0"/>
</svg>
